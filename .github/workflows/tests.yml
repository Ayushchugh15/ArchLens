name: Tests

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  parser-and-chunking:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install JavaScript and TypeScript parser
        run: npm install --no-audit --no-fund
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest tree-sitter tree-sitter-language-pack
      - name: Compile application modules
        run: python -m compileall -q analyzer backend
      - name: Run tests
        run: pytest -q
